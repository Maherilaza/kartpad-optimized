name: Shared runtime contracts
on:
  pull_request:
    paths:
      - 'vendor/runtimes/**'
      - 'tests/test_draw_merge_boundaries.py'
      - 'tests/test_sleep_timer_reentry.py'
      - 'prototypes/stabilization/batch_reservation.hpp'
      - 'prototypes/stabilization/test_batch_reservation.cpp'
      - '.github/workflows/shared-runtime-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'vendor/runtimes/**'
      - 'tests/test_draw_merge_boundaries.py'
      - 'tests/test_sleep_timer_reentry.py'
      - 'prototypes/stabilization/batch_reservation.hpp'
      - 'prototypes/stabilization/test_batch_reservation.cpp'
      - '.github/workflows/shared-runtime-contracts.yml'
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared production-source regressions on all four pins
        env:
          CXX: clang++
        run: |
          python3 -B -m unittest discover -s tests -p test_draw_merge_boundaries.py -v
          python3 -B -m unittest discover -s tests -p test_sleep_timer_reentry.py -v
      - name: Experimental atomic draw reservations
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined prototypes/stabilization/test_batch_reservation.cpp -o /tmp/kartpad-batch-reservation
          /tmp/kartpad-batch-reservation
