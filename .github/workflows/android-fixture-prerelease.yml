name: Android fixture pre-release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Build and audit source fixture APK
        env:
          KARTPAD_ANDROID_VERSION_CODE: ${{ github.run_number }}
          KARTPAD_ANDROID_VERSION_NAME: 0.0.0-fixture.${{ github.run_number }}.${{ github.run_attempt }}
        run: ./scripts/build-android-ci-fixture.sh
      - name: Publish commit pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="android-fixture-$GITHUB_SHA"
          apk="KartPad-source-fixture-$short_sha.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          notes=$(cat <<EOF
          Automated source-fixture build for commit \`$GITHUB_SHA\`.

          This APK is installable for Android integration testing but does not
          contain translated game code and is not a playable KartPad build.
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$tag" "$apk" "$apk.sha256" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "Android source fixture $short_sha" \
              --notes "$notes"
          fi
